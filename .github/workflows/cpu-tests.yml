name: Linux CPU tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CUDA_VISIBLE_DEVICES: ""
      PARKING_DATA_ROOT: ""
      PYTHONDONTWRITEBYTECODE: "1"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install matching CPU dependencies
        run: |
          python -m pip install torch==2.8.0 torchvision==0.23.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r app/requirements.txt
          python -m pip check
      - name: Confirm CPU runtime
        run: |
          python -c "import torch; assert torch.version.cuda is None; assert not torch.cuda.is_available(); print(torch.__version__)"
      - name: Verify final frozen checkpoint
        run: |
          echo '97b039fa7d4125e993903c4d1b485a7bc8e58d47cf7917c5fef8515e6982d5f9  models/v2a_balanced_resnet18.pt' | sha256sum --check
      - name: Run portable unit tests (no datasets or training)
        run: python -m unittest discover -s tests -v
      - name: Python compilation and whitespace checks
        run: |
          python -m compileall -q src app tests
          git diff --check
