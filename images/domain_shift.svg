<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Domain shift visualization</title>
<desc id="desc">Grouped bars show substantial accuracy and occupied-F1 drops from CNR-EXT to zero-shot PKLot.</desc>
<rect x="0" y="0" width="1600" height="900" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/>
<text x="100" y="92" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans TC',sans-serif" font-size="42" font-weight="500" fill="#172033" text-anchor="start">Domain shift exposed by zero-shot transfer</text>
<text x="100" y="132" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans TC',sans-serif" font-size="23" font-weight="400" fill="#566176" text-anchor="start">CNR-EXT source-domain test vs. PKLot target-domain evaluation</text>
<rect x="1120" y="82" width="24" height="24" rx="4" fill="#2563EB" stroke="none" stroke-width="0"/>
<text x="1158" y="103" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans TC',sans-serif" font-size="20" font-weight="400" fill="#172033" text-anchor="start">CNR-EXT test</text>
<rect x="1345" y="82" width="24" height="24" rx="4" fill="#E8792E" stroke="none" stroke-width="0"/>
<text x="1383" y="103" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans TC',sans-serif" font-size="20" font-weight="400" fill="#172033" text-anchor="start">PKLot zero-shot</text>
